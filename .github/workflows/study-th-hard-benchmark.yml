name: STUDY TH Hard Math Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hard_math:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run hard benchmark
        shell: bash
        run: |
          set -euo pipefail
          export SMOKE_ONLY=0
          export SMOKE_ENDPOINT="https://hoc-va-choi.vercel.app/api/solve"
          echo "Full benchmark endpoint: $SMOKE_ENDPOINT"
          python3 benchmarks/study_th_hard_benchmark.py
      - name: Publish result
        uses: actions/upload-artifact@v4
        with:
          name: study-th-hard-results
          path: benchmark-hard-results.json
