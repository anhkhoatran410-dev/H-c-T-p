name: Security Benchmark
# Live non-destructive production security regression trigger

on:
  workflow_dispatch:
  push:
    paths:
      - 'api/**'
      - 'lib/api/**'
      - 'lib/generation-guard.js'
      - 'benchmarks/security_benchmark.py'
      - 'benchmarks/output-guard-live.mjs'
      - 'scripts/security-regression.mjs'
      - 'scripts/security-static-hardening.mjs'
      - '.github/workflows/security-benchmark.yml'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run non-destructive security benchmark
        env:
          BASE_URL: https://hoc-va-choi.vercel.app
        run: python3 benchmarks/security_benchmark.py

      - name: Run live cross-endpoint output guard benchmark
        env:
          BASE_URL: https://hoc-va-choi.vercel.app
        run: node benchmarks/output-guard-live.mjs

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-benchmark-results
          path: |
            security-benchmark-results.json
            output-guard-live-results.json
          if-no-files-found: ignore
