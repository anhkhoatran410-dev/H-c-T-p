name: MER review timeout regression
on:
  push:
    branches:
      - patch/mer-review-deadline
jobs:
  mer-review-timeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          node --check lib/mer-engine.js
          node --check scripts/mer-review-timeout-test.mjs
      - run: node scripts/mer-review-timeout-test.mjs
