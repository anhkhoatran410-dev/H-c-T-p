name: Security Audit

on:
  push:
    branches: [main, security-hardening, security-final-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Scan repository for high-risk secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for dangerous secret/config files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=0
          while IFS= read -r -d '' file; do
            case "$file" in
              *.env|*.env.*|*.pem|*.key|id_rsa|id_ed25519)
                echo "Potential secret file tracked: $file"
                forbidden=1
                ;;
            esac
          done < <(git ls-files -z)
          if [ "$forbidden" -ne 0 ]; then exit 1; fi

      - name: Basic JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            node --check "$file"
          done < <(find api admin scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 2>/dev/null || true)
          if [ "$found" -eq 0 ]; then echo "No JavaScript files found for syntax check."; fi

      - name: Bounded audit and security-state local test
        run: node scripts/security-local.mjs

      - name: Security regression tests
        run: node scripts/security-regression.mjs
\n      - name: MER review timeout regression\n        run: node scripts/mer-review-timeout-test.mjs\n
      - name: Live AI preview smoke test
        if: ${{ github.event_name == 'pull_request' }}
        env:
          ENDPOINT: https://hoc-va-choi-git-ai-speed-stability-20260918-study-boots.vercel.app/api/solve
          ORIGIN: https://hoc-va-choi-git-ai-speed-stability-20260918-study-boots.vercel.app
        shell: bash
        run: |
          set -euo pipefail

          smoke_request() {
            local body="$1"
            local out="$2"
            local status
            status=$(curl -sS --max-time 90 -o "$out" -w '%{http_code}' -X POST "$ENDPOINT" \
              -H 'Content-Type: application/json' \
              -H "Origin: $ORIGIN" \
              --data "$body" || true)
            echo "$status" > "$out.status"
          }

          smoke_request '{"message":"Tính 2+3*4. Cuối câu trả lời ghi đúng một dòng: FINAL_ANSWER: 14","subject":"Toán","history":[],"imageDataUrl":"","deep":false}' /tmp/fast.json
          FAST_STATUS=$(cat /tmp/fast.json.status)

          if [ "$FAST_STATUS" != "200" ]; then
            echo "Preview returned HTTP $FAST_STATUS; checking whether the deployment is unavailable."
            if [ "$FAST_STATUS" = "502" ] || [ "$FAST_STATUS" = "503" ]; then
              echo "SKIP: Vercel preview is temporarily unavailable/platform-limited."
              exit 0
            fi
            echo "FAST smoke test failed with unexpected HTTP $FAST_STATUS"
            cat /tmp/fast.json || true
            exit 1
          fi

          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/fast.json','utf8'));
          if(!d.answer || d.deepMode!==false || d.olympiadMode!==false) throw new Error('FAST path failed');
          console.log(JSON.stringify({model:d.model,deepMode:d.deepMode,totalLatencyMs:d.totalLatencyMs,tool:d.tool}));
          NODE

          smoke_request '{"message":"VMO: Chứng minh rằng với mọi số thực x,y,z thỏa x+y+z=0 thì x^3+y^3+z^3=3xyz. Cuối câu trả lời ghi đúng một dòng: FINAL_ANSWER: 0","subject":"Toán Olympic","history":[],"imageDataUrl":"","deep":true}' /tmp/deep.json
          DEEP_STATUS=$(cat /tmp/deep.json.status)

          if [ "$DEEP_STATUS" != "200" ]; then
            echo "VMO preview returned HTTP $DEEP_STATUS."
            if [ "$DEEP_STATUS" = "502" ] || [ "$DEEP_STATUS" = "503" ]; then
              echo "SKIP: Vercel preview became temporarily unavailable after FAST test."
              exit 0
            fi
            cat /tmp/deep.json || true
            exit 1
          fi

          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/deep.json','utf8'));
          if(!d.answer || d.deepMode!==true || d.olympiadMode!==true || d.router?.used!==true) throw new Error('VMO deep path failed');
          console.log(JSON.stringify({model:d.model,deepMode:d.deepMode,olympiadMode:d.olympiadMode,router:d.router,auditVerdict:d.auditVerdict,totalLatencyMs:d.totalLatencyMs,tool:d.tool}));
          NODE
      - name: Live AI production smoke test
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          ENDPOINT: https://hoc-va-choi.vercel.app/api/solve
          ORIGIN: https://hoc-va-choi.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          # Allow the Vercel production deployment triggered by this push to propagate.
          sleep 20
          payload='{"message":"Tính 2+3. Cuối câu trả lời ghi đúng một dòng: FINAL_ANSWER: 5","subject":"Toán","history":[],"imageDataUrl":"","deep":false}'
          status=$(curl -sS --max-time 60 -o /tmp/ai-smoke.json -w '%{http_code}' -X POST "$ENDPOINT" \
            -H 'Content-Type: application/json' \
            -H "Origin: $ORIGIN" \
            --data "$payload")
          echo "AI smoke HTTP $status"
          cat /tmp/ai-smoke.json
          if [ "$status" != "200" ]; then
            echo "Production AI smoke failed: HTTP $status"
            cat /tmp/ai-smoke.json || true
            exit 1
          fi
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/ai-smoke.json','utf8'));
          if(!d.answer) throw new Error('AI response has no answer');
          console.log(JSON.stringify({model:d.model,source:d.source,answerPreview:String(d.answer).slice(0,120),router:d.router||null}));
          NODE
      - name: Live cross-endpoint output guard benchmark
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          BASE_URL: https://hoc-va-choi.vercel.app
        run: node benchmarks/output-guard-live.mjs

      - name: Upload output guard live report
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: output-guard-live-results
          path: output-guard-live-results.json
          if-no-files-found: ignore

      - name: Security static hardening checks
        run: node scripts/security-static-hardening.mjs
