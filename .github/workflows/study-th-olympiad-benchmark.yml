name: STUDY TH Olympiad Ceiling Benchmark

on:
  push:
    paths:
      - 'api/solve.js'
      - 'benchmarks/study_th_olympiad_benchmark.py'
      - '.github/workflows/study-th-olympiad-benchmark.yml'
  workflow_dispatch:

jobs:
  olympiad_ceiling:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Run Olympiad ceiling benchmark
        run: python3 benchmarks/study_th_olympiad_benchmark.py
      - name: Publish detailed results
        uses: actions/upload-artifact@v4
        with:
          name: study-th-olympiad-results
          path: |
            benchmark-olympiad-results.json
            benchmark-olympiad-results.csv
