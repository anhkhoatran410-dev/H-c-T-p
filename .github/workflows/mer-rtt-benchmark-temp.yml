name: MER RTT Benchmark Temp

on:
  push:
    branches:
      - bench/mer-rtt-after-3-patches

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Benchmark pre/post Patch 1 and final
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/mer-rtt-child.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { pathToFileURL } from 'node:url';
          import process from 'node:process';

          const TARGET_SHA=process.env.TARGET_SHA;
          const SAMPLES=Number(process.env.SAMPLES||20);
          const REDIS_URL='https://redis.test';
          const redisState={meta:null};
          const stats={
            redisRtts:0,
            redisEval:0,
            redisPipeline:0,
            redisCommandCounts:{},
            providerCalls:0,
            totalLatencyMs:0,
            sampleLatenciesMs:[]
          };

          globalThis.fetch=async(input,init={})=>{
            const url=typeof input==='string'?input:String(input?.url||'');
            if(url.startsWith(REDIS_URL)){
              stats.redisRtts++;
              const body=String(init.body||'');
              let command=null;
              try{command=JSON.parse(body);}catch{}

              if(Array.isArray(command)&&Array.isArray(command[0])){
                stats.redisPipeline++;
                const results=[];
                for(const c of command) results.push({result:[]});
                return new Response(JSON.stringify(results),{
                  status:200,
                  headers:{'content-type':'application/json'}
                });
              }

              if(Array.isArray(command)){
                const name=String(command[0]||'').toUpperCase();
                stats.redisCommandCounts[name]=(stats.redisCommandCounts[name]||0)+1;
                if(name==='GET'){
                  return new Response(JSON.stringify({result:redisState.meta}),{
                    status:200,
                    headers:{'content-type':'application/json'}
                  });
                }
                if(name==='SET'){
                  redisState.meta=String(command[2]??'');
                  return new Response(JSON.stringify({result:'OK'}),{
                    status:200,
                    headers:{'content-type':'application/json'}
                  });
                }
                if(name==='EVAL'){
                  stats.redisEval++;
                  return new Response(JSON.stringify({result:1}),{
                    status:200,
                    headers:{'content-type':'application/json'}
                  });
                }
                return new Response(JSON.stringify({result:1}),{
                  status:200,
                  headers:{'content-type':'application/json'}
                });
              }

              return new Response(JSON.stringify({result:1}),{
                status:200,
                headers:{'content-type':'application/json'}
              });
            }

            stats.providerCalls++;
            const text='AI_OK';
            return new Response(JSON.stringify({
              candidates:[{
                content:{parts:[{text}]},
                finishReason:'STOP'
              }]
            }),{
              status:200,
              headers:{'content-type':'application/json'}
            });
          };

          process.env.GEMINI_API_KEY='bench-key';
          process.env.GEMINI_API_KEY_2='';
          process.env.GEMINI_MODEL='';
          process.env.GEMINI_FALLBACK_MODELS='';
          process.env.UPSTASH_REDIS_REST_URL=REDIS_URL;
          process.env.UPSTASH_REDIS_REST_TOKEN='bench-token';

          await import(pathToFileURL(process.cwd()+'/lib/api/_gemini-network-guard.js').href);
          const {merSolve}=await import(pathToFileURL(process.cwd()+'/lib/mer-engine.js').href);

          const solve=()=>merSolve({
            message:'Tính 2+3 và trình bày ngắn gọn.',
            subject:'Toán',
            history:[],
            image:'',
            olympiad:false,
            cas:''
          });

          await solve();
          stats.redisRtts=0;
          stats.redisEval=0;
          stats.redisPipeline=0;
          stats.redisCommandCounts={};
          stats.providerCalls=0;

          for(let i=0;i<SAMPLES;i++){
            const started=Date.now();
            const result=await solve();
            const elapsed=Date.now()-started;
            assert.equal(result.reviewSkipped,false,'benchmark case must stay on normal review path');
            stats.totalLatencyMs+=elapsed;
            stats.sampleLatenciesMs.push(elapsed);
          }

          const logicalCalls=SAMPLES*3;
          assert.equal(stats.providerCalls,logicalCalls,'normal MER solve should use 3 physical provider calls per sample with no failures');
          assert.equal(stats.redisRtts%logicalCalls,0,'Redis RTT total must divide by logical calls');

          const out={
            target_sha:TARGET_SHA,
            samples:SAMPLES,
            logical_calls:logicalCalls,
            physical_provider_calls:stats.providerCalls,
            redis_rtt_total:stats.redisRtts,
            redis_rtt_per_logical_call:stats.redisRtts/logicalCalls,
            redis_eval_total:stats.redisEval,
            redis_pipeline_total:stats.redisPipeline,
            redis_command_counts:stats.redisCommandCounts,
            avg_total_latency_ms:Number((stats.totalLatencyMs/SAMPLES).toFixed(3)),
            p50_total_latency_ms:stats.sampleLatenciesMs.slice().sort((a,b)=>a-b)[Math.floor((SAMPLES-1)*0.50)],
            p95_total_latency_ms:stats.sampleLatenciesMs.slice().sort((a,b)=>a-b)[Math.floor((SAMPLES-1)*0.95)]
          };
          console.log(JSON.stringify(out,null,2));
          console.log('MER_RTT_RESULT '+JSON.stringify(out));
          NODE

          for sha in \
            b2916b247270dd7c79ba4b0a1ade0448e3e3dc7b \
            414b8fd7aa90018450ea7eb8e5fdbbceaf7a964f \
            958bbc29e8270d45d8415655fac7f3a5d350bc35
          do
            git checkout --detach "$sha"
            echo "=== TARGET $sha ==="
            TARGET_SHA="$sha" SAMPLES=20 node /tmp/mer-rtt-child.mjs | tee "/tmp/mer-rtt-$sha.json"
          done

      - name: Upload benchmark logs
        uses: actions/upload-artifact@v4
        with:
          name: mer-rtt-benchmark
          path: /tmp/mer-rtt-*.json
          if-no-files-found: error
