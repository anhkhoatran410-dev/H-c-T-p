name: STUDY TH Hard Math Benchmark

on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/study_th_hard_benchmark.py'
      - 'lib/solve-legacy.js'
      - '.github/workflows/study-th-hard-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hard_math:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run hard benchmark
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            export SMOKE_ONLY=1
          else
            export SMOKE_ONLY=0
          fi
          export SMOKE_ENDPOINT="https://hoc-va-choi.vercel.app/api/solve"
          echo "Benchmark endpoint: $SMOKE_ENDPOINT"
          python3 benchmarks/study_th_hard_benchmark.py
      - name: Publish result
        uses: actions/upload-artifact@v4
        with:
          name: study-th-hard-results
          path: benchmark-hard-results.json
