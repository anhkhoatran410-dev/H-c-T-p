name: Security Audit

on:
  push:
    branches: [main, security-hardening, security-final-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Scan repository for high-risk secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for dangerous secret/config files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=0
          while IFS= read -r -d '' file; do
            case "$file" in
              *.env|*.env.*|*.pem|*.key|id_rsa|id_ed25519)
                echo "Potential secret file tracked: $file"
                forbidden=1
                ;;
            esac
          done < <(git ls-files -z)
          if [ "$forbidden" -ne 0 ]; then exit 1; fi

      - name: Basic JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            node --check "$file"
          done < <(find api admin scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 2>/dev/null || true)
          if [ "$found" -eq 0 ]; then echo "No JavaScript files found for syntax check."; fi

      - name: Bounded audit and security-state local test
        run: node scripts/security-local.mjs

      - name: Security regression tests
        run: node scripts/security-regression.mjs

      - name: Live AI preview smoke test
        if: ${{ github.event_name == 'pull_request' }}
        env:
          ENDPOINT: https://hoc-va-choi-git-ai-speed-stability-20260918-study-boots.vercel.app/api/solve
          ORIGIN: https://hoc-va-choi-git-ai-speed-stability-20260918-study-boots.vercel.app
        shell: bash
        run: |
          set -euo pipefail

          smoke_request() {
            local body="$1"
            local out="$2"
            local status
            status=$(curl -sS --max-time 90 -o "$out" -w '%{http_code}' -X POST "$ENDPOINT" \
              -H 'Content-Type: application/json' \
              -H "Origin: $ORIGIN" \
              --data "$body" || true)
            echo "$status" > "$out.status"
          }

          smoke_request '{"message":"Tính 2+3*4. Cuối câu trả lời ghi đúng một dòng: FINAL_ANSWER: 14","subject":"Toán","history":[],"imageDataUrl":"","deep":false}' /tmp/fast.json
          FAST_STATUS=$(cat /tmp/fast.json.status)

          if [ "$FAST_STATUS" != "200" ]; then
            echo "Preview returned HTTP $FAST_STATUS; checking whether the deployment is unavailable."
            if [ "$FAST_STATUS" = "502" ] || [ "$FAST_STATUS" = "503" ]; then
              echo "SKIP: Vercel preview is temporarily unavailable/platform-limited."
              exit 0
            fi
            echo "FAST smoke test failed with unexpected HTTP $FAST_STATUS"
            cat /tmp/fast.json || true
            exit 1
          fi

          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/fast.json','utf8'));
          if(!d.answer || d.deepMode!==false || d.olympiadMode!==false) throw new Error('FAST path failed');
          console.log(JSON.stringify({model:d.model,deepMode:d.deepMode,totalLatencyMs:d.totalLatencyMs,tool:d.tool}));
          NODE

          smoke_request '{"message":"VMO: Chứng minh rằng với mọi số thực x,y,z thỏa x+y+z=0 thì x^3+y^3+z^3=3xyz. Cuối câu trả lời ghi đúng một dòng: FINAL_ANSWER: 0","subject":"Toán Olympic","history":[],"imageDataUrl":"","deep":true}' /tmp/deep.json
          DEEP_STATUS=$(cat /tmp/deep.json.status)

          if [ "$DEEP_STATUS" != "200" ]; then
            echo "VMO preview returned HTTP $DEEP_STATUS."
            if [ "$DEEP_STATUS" = "502" ] || [ "$DEEP_STATUS" = "503" ]; then
              echo "SKIP: Vercel preview became temporarily unavailable after FAST test."
              exit 0
            fi
            cat /tmp/deep.json || true
            exit 1
          fi

          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/deep.json','utf8'));
          if(!d.answer || d.deepMode!==true || d.olympiadMode!==true || d.router?.used!==true) throw new Error('VMO deep path failed');
          console.log(JSON.stringify({model:d.model,deepMode:d.deepMode,olympiadMode:d.olympiadMode,router:d.router,auditVerdict:d.auditVerdict,totalLatencyMs:d.totalLatencyMs,tool:d.tool}));
          NODE
      - name: Live AI production smoke test
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          ENDPOINT: https://hoc-va-choi.vercel.app/api/solve
          ORIGIN: https://hoc-va-choi.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          # Allow the Vercel production deployment triggered by this push to propagate.
          sleep 20
          payload='{"message":"Tính 2+3. Cuối câu trả lời ghi đúng một dòng: FINAL_ANSWER: 5","subject":"Toán","history":[],"imageDataUrl":"","deep":false}'
          status=$(curl -sS --max-time 60 -o /tmp/ai-smoke.json -w '%{http_code}' -X POST "$ENDPOINT" \
            -H 'Content-Type: application/json' \
            -H "Origin: $ORIGIN" \
            --data "$payload")
          echo "AI smoke HTTP $status"
          cat /tmp/ai-smoke.json
          if [ "$status" != "200" ]; then
            echo "Production AI smoke failed: HTTP $status"
            cat /tmp/ai-smoke.json || true
            exit 1
          fi
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/ai-smoke.json','utf8'));
          if(!d.answer) throw new Error('AI response has no answer');
          console.log(JSON.stringify({model:d.model,source:d.source,answerPreview:String(d.answer).slice(0,120),router:d.router||null}));
          NODE
      - name: Live cross-endpoint output guard benchmark
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          BASE_URL: https://hoc-va-choi.vercel.app
        run: node benchmarks/output-guard-live.mjs

      - name: Upload output guard live report
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: output-guard-live-results
          path: output-guard-live-results.json
          if-no-files-found: ignore

      - name: Security static hardening checks
        run: node scripts/security-static-hardening.mjs

      - name: TEMP MER Redis RTT benchmark
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/mer-rtt-child.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { pathToFileURL } from 'node:url';

          const TARGET_SHA=process.env.TARGET_SHA;
          const SAMPLES=20;
          const REDIS_URL='https://redis.test';
          const redisState={meta:null};
          let redisRtts=0, redisEval=0, redisPipeline=0, providerCalls=0;
          const redisCommands={};
          const sampleLatencies=[];

          globalThis.fetch=async(input,init={})=>{
            const url=typeof input==='string'?input:String(input?.url||'');
            if(url.startsWith(REDIS_URL)){
              redisRtts++;
              let command=null;
              try{command=JSON.parse(String(init.body||''));}catch{}
              if(Array.isArray(command)&&Array.isArray(command[0])){
                redisPipeline++;
                return new Response(JSON.stringify(command.map(()=>({result:[]}))),{status:200,headers:{'content-type':'application/json'}});
              }
              if(Array.isArray(command)){
                const name=String(command[0]||'').toUpperCase();
                redisCommands[name]=(redisCommands[name]||0)+1;
                if(name==='GET')return new Response(JSON.stringify({result:redisState.meta}),{status:200,headers:{'content-type':'application/json'}});
                if(name==='SET'){redisState.meta=String(command[2]??'');return new Response(JSON.stringify({result:'OK'}),{status:200,headers:{'content-type':'application/json'}});
                }
                if(name==='EVAL'){redisEval++;return new Response(JSON.stringify({result:1}),{status:200,headers:{'content-type':'application/json'}});
                }
              }
              return new Response(JSON.stringify({result:1}),{status:200,headers:{'content-type':'application/json'}});
            }
            providerCalls++;
            return new Response(JSON.stringify({candidates:[{content:{parts:[{text:'AI_OK'}]},finishReason:'STOP'}]}),{status:200,headers:{'content-type':'application/json'}});
          };

          process.env.GEMINI_API_KEY='bench-key';
          process.env.GEMINI_API_KEY_2='';
          process.env.GEMINI_MODEL='';
          process.env.GEMINI_FALLBACK_MODELS='';
          process.env.UPSTASH_REDIS_REST_URL=REDIS_URL;
          process.env.UPSTASH_REDIS_REST_TOKEN='bench-token';

          await import(pathToFileURL(process.cwd()+'/lib/api/_gemini-network-guard.js').href);
          const {merSolve}=await import(pathToFileURL(process.cwd()+'/lib/mer-engine.js').href);

          const solve=()=>merSolve({message:'Tính 2+3 và trình bày ngắn gọn.',subject:'Toán',history:[],image:'',olympiad:false,cas:''});

          await solve();
          redisRtts=0;redisEval=0;redisPipeline=0;providerCalls=0;Object.keys(redisCommands).forEach(k=>delete redisCommands[k]);

          for(let i=0;i<SAMPLES;i++){
            const started=Date.now();
            const result=await solve();
            assert.equal(result.reviewSkipped,false);
            sampleLatencies.push(Date.now()-started);
          }

          const logicalCalls=SAMPLES*3;
          assert.equal(providerCalls,logicalCalls);
          const s=sampleLatencies.slice().sort((a,b)=>a-b);
          const out={
            target_sha:TARGET_SHA,
            samples:SAMPLES,
            logical_calls:logicalCalls,
            physical_provider_calls:providerCalls,
            redis_rtt_total:redisRtts,
            redis_rtt_per_logical_call:redisRtts/logicalCalls,
            redis_eval_total:redisEval,
            redis_pipeline_total:redisPipeline,
            redis_command_counts:redisCommands,
            avg_total_latency_ms:Number((sampleLatencies.reduce((a,b)=>a+b,0)/SAMPLES).toFixed(3)),
            p50_total_latency_ms:s[Math.floor((SAMPLES-1)*0.50)],
            p95_total_latency_ms:s[Math.floor((SAMPLES-1)*0.95)]
          };
          console.log('MER_RTT_RESULT '+JSON.stringify(out));
          NODE

          for sha in \
            b2916b247270dd7c79ba4b0a1ade0448e3e3dc7b \
            414b8fd7aa90018450ea7eb8e5fdbbceaf7a964f \
            958bbc29e8270d45d8415655fac7f3a5d350bc35
          do
            git checkout --detach "$sha"
            TARGET_SHA="$sha" node /tmp/mer-rtt-child.mjs
          done

      - name: TEMP final MER latency split benchmark
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error, statistics

          ENDPOINT='https://hoc-va-choi.vercel.app/api/solve'
          ORIGIN='https://hoc-va-choi.vercel.app'

          def pct(values,p):
              xs=sorted(values)
              if not xs: return 0
              return round(xs[min(len(xs)-1,int((len(xs)-1)*p))],3)

          def call(message,subject='Toán'):
              payload=json.dumps({'message':message,'subject':subject,'history':[],'imageDataUrl':'','deep':False}).encode()
              req=urllib.request.Request(ENDPOINT,data=payload,headers={'Content-Type':'application/json','Origin':ORIGIN})
              started=time.time()
              try:
                  with urllib.request.urlopen(req,timeout=90) as r:
                      body=r.read().decode()
                      elapsed=time.time()-started
                      return {'http':r.status,'elapsed_sec':elapsed,'data':json.loads(body)}
              except Exception as e:
                  return {'http':0,'elapsed_sec':time.time()-started,'error':repr(e),'data':{}}

          rows=[]
          for i in range(10):
              rows.append(('EARLY',call(f'Benchmark early-exit case {i}: Giải {i+2}+{i+3}. Cuối câu ghi FINAL_ANSWER: {2*i+5}')))

          normal_cases=[
              'Chứng minh rằng với mọi số thực x,y,z thỏa x+y+z=0 thì x^3+y^3+z^3=3xyz.',
              'Chứng minh bất đẳng thức a^2+b^2>=2ab với mọi số thực a,b.',
              'Chứng minh rằng tổng ba số lẻ là một số lẻ.',
              'Chứng minh nếu n chia hết cho 6 thì n chia hết cho 2 và 3.',
              'Chứng minh với mọi x>0 thì x+1/x>=2.'
          ]
          for i,statement in enumerate(normal_cases*2):
              rows.append(('NORMAL',call(f'Benchmark normal review case {i}: {statement}','Toán Olympic')))

          for group in ('EARLY','NORMAL'):
              subset=[r for g,r in rows if g==group]
              lat=[r['data'].get('latencyMs',r['elapsed_sec']*1000) for r in subset if r['http']==200 and r['data']]
              timeout_fallback=sum(bool(r['data'].get('timeoutFallback')) for r in subset if r['http']==200)
              degraded=sum(bool(r['data'].get('degraded')) for r in subset if r['http']==200)
              skipped=sum(bool(r['data'].get('reviewSkipped')) for r in subset if r['http']==200)
              print(json.dumps({
                  'group':group,'requests':len(subset),
                  'http200':sum(r['http']==200 for r in subset),
                  'latency_p50_ms':pct(lat,.50),
                  'latency_p95_ms':pct(lat,.95),
                  'latency_p99_ms':pct(lat,.99),
                  'review_skipped':skipped,
                  'timeout_fallback':timeout_fallback,
                  'degraded':degraded
              },ensure_ascii=False))
          PY
