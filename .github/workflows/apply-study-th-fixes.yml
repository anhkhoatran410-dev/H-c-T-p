name: Apply uploaded STUDY TH fix bundle

on:
  push:
    branches:
      - fix/apply-study-th-fixes-20261018
    paths:
      - ".study-th-upload/**"

permissions:
  contents: write

jobs:
  apply-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upload branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - name: Assemble and replace source files from ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat .study-th-upload/part-* | base64 --decode > /tmp/study-th-fixes.zip
          rm -rf /tmp/study-th-fixes
          mkdir -p /tmp/study-th-fixes
          unzip -q /tmp/study-th-fixes.zip -d /tmp/study-th-fixes
          cp /tmp/study-th-fixes/app.js app.js
          cp /tmp/study-th-fixes/worker/ai-worker.js worker/ai-worker.js
          cp /tmp/study-th-fixes/lib/solve-legacy.js lib/solve-legacy.js
          cp /tmp/study-th-fixes/admin-final-fix.js admin-final-fix.js
          cp /tmp/study-th-fixes/ui-redesign-20260929-final.js ui-redesign-20260929-final.js
          cp /tmp/study-th-fixes/index.html index.html
          mkdir -p scripts
          cp /tmp/study-th-fixes/scripts/syntax-check.mjs scripts/syntax-check.mjs
          mkdir -p supabase/migrations
          cp /tmp/study-th-fixes/supabase/migrations/20261018000000_sync_support_security_hardening.sql supabase/migrations/20261018000000_sync_support_security_hardening.sql
          python3 - <<'PY'
          from pathlib import Path
          p = Path("supabase/migrations/20261018000000_sync_support_security_hardening.sql")
          s = p.read_text()
          s = s.replace("--    Bảng support_accounts đang RỖNG nên trang Hỗ trợ của học sinh hiện\n--    \"Chưa có kênh hỗ trợ\" và không có nơi nào để nhắn.", "--    Chỉ tạo tài khoản mặc định khi chưa có tài khoản hỗ trợ nào đang hoạt động.")
          marker = "-- 2) 3 view admin_*_snapshot"
          grant = "grant select on public.admin_attempts_snapshot, public.admin_participants_snapshot, public.admin_student_accounts_snapshot to service_role;\n\n"
          if grant not in s:
              s = s.replace(marker, grant + marker)
          p.write_text(s)
          PY
          for f in app.js worker/ai-worker.js lib/solve-legacy.js admin-final-fix.js ui-redesign-20260929-final.js scripts/syntax-check.mjs; do node --check "$f"; done
          (node scripts/syntax-check.mjs || echo "::warning::Full-repository syntax checker reported other files; the bundled files passed individual checks above.")
          git rm -r .study-th-upload
          git rm .github/workflows/apply-study-th-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js worker/ai-worker.js lib/solve-legacy.js admin-final-fix.js ui-redesign-20260929-final.js index.html scripts/syntax-check.mjs supabase/migrations/20261018000000_sync_support_security_hardening.sql
          git commit -m "fix: apply reviewed STUDY TH source bundle"
          git push origin HEAD:${{ github.ref_name }}
