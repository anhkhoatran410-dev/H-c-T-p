name: MER Double Resilience Test

on:
  push:
    branches: [patch/mer-double-resilience]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Syntax check
        run: |
          node --check lib/mer-engine.js
          node --check lib/api/_gemini-network-guard.js
          node --check scripts/mer-double-resilience-test.mjs
      - name: Patch 1 regression matrix
        run: node scripts/mer-double-resilience-test.mjs
